<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Storybook Engine - Pretext Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page-bg: #faf5ed;
        --page-ink: #1e2632;
        --muted: #5e7088;
        --line: rgba(40, 54, 74, 0.1);
        --panel: rgba(255, 252, 247, 0.88);
        --accent: #c75a38;
        --shadow: 0 24px 60px rgba(36, 46, 62, 0.1);
        --radius-xl: 32px;
        --radius-lg: 24px;
        --book-bg: #fffcf7;
        --book-shadow: 0 8px 40px rgba(30, 38, 50, 0.14), 0 2px 8px rgba(30, 38, 50, 0.06);
        --highlight: rgba(255, 210, 100, 0.32);
        --site-width: min(1200px, calc(100vw - 32px));
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--page-ink);
        font-family: "Inter", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(255, 200, 120, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(180, 140, 220, 0.12), transparent 30%),
          linear-gradient(180deg, #fff8ef 0%, var(--page-bg) 50%, #f4ede3 100%);
      }

      a { color: inherit; }

      .app {
        width: var(--site-width);
        margin: 0 auto;
        padding: 24px 0 64px;
      }

      .header {
        display: grid;
        gap: 16px;
        padding: 24px 28px;
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: var(--panel);
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow);
      }

      .header__eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #536274;
        font: 700 12px/1 Inter, Arial, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .header__eyebrow::before {
        content: "";
        width: 40px;
        height: 1px;
        background: linear-gradient(90deg, var(--accent), transparent);
      }

      .header__top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }

      .header h1 {
        margin: 0;
        font: 700 clamp(1.6rem, 3vw, 2.4rem)/1 "Fraunces", Georgia, serif;
        letter-spacing: -0.03em;
      }

      .story-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .story-picker button {
        appearance: none;
        border: 1px solid rgba(40, 54, 74, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: #2a3646;
        cursor: pointer;
        font: 600 14px/1 Inter, Arial, sans-serif;
        padding: 10px 16px;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .story-picker button:hover,
      .story-picker button:focus-visible {
        transform: translateY(-1px);
        outline: none;
        box-shadow: 0 8px 20px rgba(40, 54, 74, 0.1);
      }

      .story-picker button[data-active="true"] {
        color: white;
        background: var(--accent);
        border-color: transparent;
        box-shadow: 0 10px 24px rgba(199, 90, 56, 0.22);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 20px;
        margin-top: 16px;
        padding: 16px 20px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: rgba(255, 253, 249, 0.86);
        backdrop-filter: blur(12px);
        box-shadow: 0 12px 32px rgba(36, 46, 62, 0.06);
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .control-label {
        color: #5a6c80;
        font: 600 13px/1 Inter, Arial, sans-serif;
        white-space: nowrap;
      }

      .control-group input[type="range"] {
        accent-color: var(--accent);
      }

      .control-value {
        min-width: 38px;
        font: 700 14px/1 Inter, Arial, sans-serif;
        text-align: center;
      }

      .toggle-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #3e4e60;
        font: 600 14px/1.4 Inter, Arial, sans-serif;
        cursor: pointer;
      }

      .toggle-label input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }

      .controls .meta {
        margin-left: auto;
        color: var(--muted);
        font: 500 13px/1.4 Inter, Arial, sans-serif;
      }

      /* Story-specific interaction strip */
      .story-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        margin-top: 10px;
        padding: 12px 20px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: var(--radius-lg);
        background: rgba(255, 253, 249, 0.72);
        backdrop-filter: blur(10px);
        box-shadow: 0 6px 20px rgba(36, 46, 62, 0.04);
        transition: border-color 300ms ease;
      }

      .story-controls[hidden] { display: none; }

      .story-hint {
        color: var(--muted);
        font: 500 13px/1.5 Inter, Arial, sans-serif;
      }

      .story-btn {
        appearance: none;
        border: 1.5px solid rgba(40, 54, 74, 0.16);
        border-radius: 999px;
        background: white;
        color: var(--page-ink);
        cursor: pointer;
        font: 600 13px/1 Inter, Arial, sans-serif;
        padding: 8px 18px;
        transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
        white-space: nowrap;
      }

      .story-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(36,46,62,0.1); }
      .story-btn--active { background: var(--accent); color: white; border-color: transparent; }

      .book-frame {
        position: relative;
        margin-top: 20px;
        border-radius: var(--radius-xl);
        background: var(--book-bg);
        box-shadow: var(--book-shadow);
        overflow: hidden;
        min-height: 520px;
      }

      .page-viewport { position: relative; width: 100%; overflow: hidden; }

      .page-canvas {
        position: relative;
        width: 100%;
        padding: 40px 48px 48px;
        transition: opacity 200ms ease;
      }

      .page-title-block { margin-bottom: 24px; }

      .page-title-block h2 {
        margin: 0;
        font: 700 clamp(1.8rem, 3.4vw, 2.8rem)/1.05 "Fraunces", Georgia, serif;
        letter-spacing: -0.04em;
        color: var(--accent);
      }

      .page-title-block .byline {
        margin-top: 6px;
        color: var(--muted);
        font: 400 15px/1.5 "Fraunces", Georgia, serif;
        font-style: italic;
      }

      .page-body {
        position: relative;
        min-height: 320px;
      }

      /* Rectangular illustration (robot, planes) */
      .illustration-zone {
        position: absolute;
        border-radius: 20px;
        display: grid;
        place-items: center;
        overflow: hidden;
        box-shadow: 0 6px 24px rgba(30, 38, 50, 0.08);
        transition: box-shadow 160ms ease;
      }

      .illustration-zone--draggable {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .illustration-zone--draggable:hover {
        box-shadow: 0 10px 32px rgba(30, 38, 50, 0.18), 0 0 0 2px var(--accent);
      }

      .illustration-zone--draggable:active { cursor: grabbing; }

      .illustration-zone__label {
        color: rgba(255, 255, 255, 0.9);
        font: 700 13px/1.3 Inter, Arial, sans-serif;
        text-align: center;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        padding: 8px;
        pointer-events: none;
      }

      .drag-indicator {
        position: absolute;
        bottom: 8px;
        right: 8px;
        background: rgba(0, 0, 0, 0.22);
        color: rgba(255, 255, 255, 0.88);
        font: 600 11px/1 Inter, Arial, sans-serif;
        padding: 4px 8px;
        border-radius: 6px;
        pointer-events: none;
      }

      /* Garden emojis */
      .garden-emoji {
        position: absolute;
        font-size: 20px;
        line-height: 1;
        pointer-events: none;
        user-select: none;
        z-index: 5;
        filter: drop-shadow(0 1px 3px rgba(0,0,0,0.12));
      }

      /* Paper plane sprite */
      .plane-sprite {
        position: absolute;
        font-size: 34px;
        line-height: 1;
        pointer-events: none;
        user-select: none;
        z-index: 10;
        transform-origin: center center;
        filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.18));
        color: var(--accent);
      }

      /* Tide wave SVG */
      .tide-wave-svg {
        position: absolute;
        overflow: visible;
        pointer-events: none;
      }

      .tide-wave-svg text { pointer-events: none; }

      .text-line {
        position: absolute;
        font-family: "Inter", Arial, sans-serif;
        font-weight: 500;
        white-space: pre;
        line-height: 1;
        cursor: default;
        transition: background-color 120ms ease;
        border-radius: 4px;
        padding: 0 2px;
        margin: 0 -2px;
      }

      .text-line[data-highlighted="true"] { background: var(--highlight); }

      .nav-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px 24px 20px;
        border-top: 1px solid rgba(40, 54, 74, 0.06);
      }

      .nav-btn {
        appearance: none;
        display: inline-grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border: 1px solid rgba(40, 54, 74, 0.12);
        border-radius: 50%;
        background: white;
        color: var(--page-ink);
        cursor: pointer;
        font: 700 20px/1 Inter, Arial, sans-serif;
        transition: transform 140ms ease, box-shadow 140ms ease;
      }

      .nav-btn:hover:not(:disabled),
      .nav-btn:focus-visible {
        transform: scale(1.06);
        box-shadow: 0 6px 16px rgba(36, 46, 62, 0.1);
        outline: none;
      }

      .nav-btn:disabled { opacity: 0.3; cursor: default; }

      .page-dots { display: flex; gap: 8px; }

      .page-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(40, 54, 74, 0.15);
        transition: background 180ms ease, transform 180ms ease;
      }

      .page-dot[data-active="true"] {
        background: var(--accent);
        transform: scale(1.25);
      }

      .page-indicator {
        color: var(--muted);
        font: 600 14px/1 Inter, Arial, sans-serif;
        min-width: 80px;
        text-align: center;
      }

      .status-banner {
        padding: 32px;
        text-align: center;
        color: var(--muted);
        font: 500 15px/1.6 Inter, Arial, sans-serif;
      }

      .status-banner[hidden] { display: none; }

      .footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        margin-top: 20px;
        color: #667487;
        font: 500 14px/1.6 Inter, Arial, sans-serif;
      }

      .footer a { font-weight: 700; text-decoration-thickness: 1px; }

      @media (max-width: 768px) {
        .app { width: min(100vw - 16px, 100%); padding-top: 16px; }
        .header, .controls, .story-controls { padding: 18px; }
        .page-canvas { padding: 24px 20px 28px; }
        .controls { gap: 12px; }
        .controls .meta { margin-left: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .page-canvas, .text-line, .page-dot, .nav-btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <span class="header__eyebrow">PRD 04 Prototype</span>
        <div class="header__top">
          <h1>Storybook Engine</h1>
          <div class="story-picker" id="storyPicker"></div>
        </div>
      </header>

      <section class="controls" aria-label="Reading controls">
        <div class="control-group">
          <span class="control-label">Text size</span>
          <input type="range" id="fontSlider" min="16" max="32" value="20" step="1" style="width:120px" />
          <span class="control-value" id="fontValue">20px</span>
        </div>
        <label class="toggle-label" for="readAlongToggle">
          <input type="checkbox" id="readAlongToggle" />
          Read along
        </label>
        <span class="meta" id="layoutMeta">Loading...</span>
      </section>

      <section class="story-controls" id="storyControls" hidden aria-label="Story interaction"></section>

      <main class="book-frame" id="bookFrame">
        <div class="status-banner" id="statusBanner">
          Loading fonts and the Pretext runtime...
        </div>
        <div class="page-viewport" id="pageViewport">
          <div class="page-canvas" id="pageCanvas"></div>
        </div>
        <nav class="nav-bar" aria-label="Page navigation">
          <button class="nav-btn" id="prevBtn" disabled aria-label="Previous page">&larr;</button>
          <div class="page-dots" id="pageDots"></div>
          <span class="page-indicator" id="pageIndicator">-- / --</span>
          <button class="nav-btn" id="nextBtn" disabled aria-label="Next page">&rarr;</button>
        </nav>
      </main>

      <footer class="footer">
        <span>
          Powered by
          <a href="https://github.com/chenglou/pretext" target="_blank" rel="noreferrer">Pretext</a>
          &mdash; text flows around obstacles without DOM measurement.
        </span>
        <span>Story content is placeholder text for layout prototyping.</span>
      </footer>
    </div>

    <script type="module">
      const STORIES = [
        {
          id: "tide-pools",
          title: "The Tide Pool Explorers",
          author: "a classroom story",
          accent: "#2878a8",
          pages: [
            {
              text: "Lani and Kai raced down the rocky path to the shore. The tide was low, and the rocks were full of tiny worlds waiting to be discovered. Lani knelt beside a shallow pool and peered in. A small crab shuffled sideways under a curtain of green seaweed. Kai pointed at a purple sea urchin wedged in a crack, its spines swaying gently in the water.",
              illustration: { position: "right", width: 0.38, height: 0.55 }
            },
            {
              text: "They found an orange starfish clinging to the side of a boulder. Lani counted its arms out loud: one, two, three, four, five. Each arm was covered in bumpy dots. Kai leaned closer and noticed the starfish was slowly moving, pulling itself along the rock with hundreds of tiny tube feet that were almost invisible.",
              illustration: { position: "left", width: 0.36, height: 0.50 }
            },
            {
              text: "Before they left, Kai spotted something unexpected: a tiny octopus, no bigger than a tennis ball, hiding in a crack between two rocks. It changed color right before their eyes, shifting from pale brown to reddish pink as they watched. Lani whispered that it was camouflage. They backed away slowly so the octopus could stay safe in its hideout. On the walk home they decided they would come back tomorrow, bringing a notebook to draw everything they found.",
              illustration: { position: "right", width: 0.34, height: 0.45 }
            }
          ]
        },
        {
          id: "garden-robot",
          title: "Milo and the Garden Robot",
          author: "a classroom story",
          accent: "#3a8a4e",
          pages: [
            {
              text: "Milo found the robot half-buried in the compost pile behind the school garden. It was about the size of a shoebox, with dirt on its solar panel and a cracked green light on top. He brushed off the soil, and the light flickered on. A tiny screen on its front displayed two words: READY TO HELP.",
              illustration: { position: "left", width: 0.40, height: 0.55, color: "linear-gradient(135deg, #5ab86e, #2d7a3e)", label: "🤖 Robot in the garden" }
            },
            {
              text: "The robot turned out to be very good at watering. It trundled along the rows on small rubber wheels, stopping at each plant to test the soil with a thin metal probe. When the soil was dry, it released exactly the right amount of water from a small tank on its back. When the soil was already damp, it moved on without wasting a single drop.",
              illustration: { position: "right", width: 0.36, height: 0.50, color: "linear-gradient(135deg, #68c4de, #3a8aaa)", label: "🤖 Robot watering plants" }
            },
            {
              text: "By Friday the garden looked better than it had all year. The tomatoes were standing straight, the basil smelled stronger, and even the stubborn squash had new yellow flowers. The whole class gathered around Milo and the robot for a photo. The robot's screen changed one more time. It said: GOOD TEAM.",
              illustration: { position: "left", width: 0.35, height: 0.48, color: "linear-gradient(135deg, #e8c44a, #c89e28)", label: "🌻 Blooming garden" }
            }
          ]
        },
        {
          id: "paper-planes",
          title: "The Paper Plane Contest",
          author: "a classroom story",
          accent: "#6456b8",
          pages: [
            {
              text: "Ms. Rivera handed out one sheet of paper to every student and said: the plane that flies the farthest wins. No tape. No glue. No scissors. Just folds. The room got quiet as everyone started experimenting. Some kids made sharp darts. Others made wide gliders with big wings. Jun folded his paper into something that looked like a bird with swept-back wings and a tiny tail fin.",
              illustration: { position: "right", width: 0.38, height: 0.52, color: "linear-gradient(135deg, #7b6fd4, #5248a0)", label: "Students folding planes" }
            },
            {
              text: "They went outside to the blacktop for the launch. One by one, each student threw their plane. The darts flew fast but dove into the ground. The wide gliders floated gently but did not go very far. When it was Jun's turn, he held his plane up, angled it slightly, and released it with a smooth push instead of a hard throw.",
              illustration: { position: "left", width: 0.36, height: 0.50, color: "linear-gradient(135deg, #5aa8e0, #3878b0)", label: "Planes flying on blacktop" }
            },
            {
              text: "Jun's plane sailed in a long, gentle curve. It caught a small gust of wind and kept gliding, passing every other mark on the pavement. When it finally touched down, the whole class cheered. Ms. Rivera asked Jun what his secret was. He said he tried six different folds at home and that the secret was the little tail fin, because it kept the plane from spinning. She smiled and said that was exactly what engineers do: test, fail, adjust, and try again.",
              illustration: { position: "right", width: 0.34, height: 0.44, color: "linear-gradient(135deg, #4ec4a0, #2e9478)", label: "Winning plane landing" }
            }
          ]
        }
      ];

      const FONT_FAMILY = '"Inter", Arial, sans-serif';
      const LINE_HEIGHT_RATIO = 1.8;
      const ILLUST_GAP = 20;
      const PLANE_W = 68;
      const PLANE_H = 36;
      const PLANE_BASE_DURATION = 2600; // ms at speed 1×

      // Garden emojis: [emoji, dx-from-right-edge, dy-from-top] or left edge
      const GARDEN_EMOJIS = [
        { e: "🌱", ex: 10, ey: 8 },
        { e: "🌿", ex: 10, ey: -26 },
        { e: "🍅", ex: 10, ey: "bottom-30" },
        { e: "🌻", ex: 10, ey: "bottom+8" },
        { e: "🐝", ex: "center", ey: -28 },
        { e: "🪱", ex: "center+20", ey: "bottom-4" },
      ];

      const storyPicker     = document.getElementById("storyPicker");
      const fontSlider      = document.getElementById("fontSlider");
      const fontValue       = document.getElementById("fontValue");
      const readAlongToggle = document.getElementById("readAlongToggle");
      const layoutMeta      = document.getElementById("layoutMeta");
      const statusBanner    = document.getElementById("statusBanner");
      const pageCanvas      = document.getElementById("pageCanvas");
      const prevBtn         = document.getElementById("prevBtn");
      const nextBtn         = document.getElementById("nextBtn");
      const pageDots        = document.getElementById("pageDots");
      const pageIndicator   = document.getElementById("pageIndicator");
      const storyControlsEl = document.getElementById("storyControls");

      const state = {
        pretext: null,
        activeStoryId: STORIES[0].id,
        fontSize: 20,
        currentPage: 0,
        totalPages: 0,
        readAlong: false,
        highlightedLine: -1,
        paginatedPages: [],
        preparedTexts: new Map(),
        rafId: null,
        // Tide pool
        tideLevel: 0.25,
        // Garden robot
        robotPos: null,      // { x, y } override position
        robotScale: 1.0,     // 0.4 – 1.4 multiplier on default size
        // Paper plane
        planeActive: false,
        planeProgress: 0,
        planeAnimRaf: null,
        planeStartTime: 0,
        planeEffectiveDuration: PLANE_BASE_DURATION,
        planeSpeed: 1.0,
        lastFrameTime: 0,
        fps: 0,
      };

      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function activeStory() { return STORIES.find(s => s.id === state.activeStoryId); }
      function fontString(size) { return `500 ${size}px ${FONT_FAMILY}`; }
      function lineHeight(size) { return Math.round(size * LINE_HEIGHT_RATIO); }

      // ── Tide wave helpers ──────────────────────────────────────────────────
      function tideRGB(level) {
        return {
          r: Math.round(180 - 150 * level),
          g: Math.round(148 - 38  * level),
          b: Math.round(108 + 62  * level),
        };
      }

      // SVG path for animated wave on the LEFT edge of the tide illustration.
      // The wave oscillates around x=amp, with peaks reaching x=0 (into text space).
      // svgW = r.w + amp  (SVG is positioned amp px left of the obstacle rect)
      function wavePathD(svgW, h, amp, phase) {
        const numWaves = 2.5;
        const steps = 30;
        let d = "";
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const py = (t * h).toFixed(1);
          const px = (amp + amp * Math.sin(t * Math.PI * 2 * numWaves + phase)).toFixed(1);
          d += i === 0 ? `M ${px},${py} ` : `L ${px},${py} `;
        }
        return d + `L ${svgW},${h} L ${svgW},0 Z`;
      }

      function tideLabel(level) {
        if (level < 0.18) return "Exposed rocks";
        if (level < 0.45) return "Tide rising\u2026";
        if (level < 0.78) return "High tide";
        return "Fully submerged!";
      }

      // Build the animated SVG wave illustration for tide-pools.
      function renderTideWaveSvg(r, tideLevel) {
        const { x: rx, y: ry, w, h } = r;
        const amp = Math.round(10 + tideLevel * 18); // wave amplitude grows with tide
        const svgW = w + amp;
        // SVG positioned `amp` px to the LEFT of the obstacle rect
        const svgLeft = rx - amp;
        const { r: rv, g: gv, b: bv } = tideRGB(tideLevel);
        const c1 = `rgb(${rv},${gv},${bv})`;
        const c2 = `rgb(${Math.round(rv*0.65)},${Math.round(gv*0.65)},${Math.round(bv*0.8)})`;
        const label = tideLabel(tideLevel);

        // Three keyframe phases for smooth looping wave
        const d0 = wavePathD(svgW, h, amp, 0);
        const d1 = wavePathD(svgW, h, amp, Math.PI * 0.67);
        const d2 = wavePathD(svgW, h, amp, Math.PI * 1.33);
        const dur = 2 + (1 - tideLevel) * 1.5; // faster at high tide

        return `<svg class="tide-wave-svg" style="left:${svgLeft}px;top:${ry}px;width:${svgW}px;height:${h}px" aria-hidden="true">
          <defs>
            <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${c1}"/>
              <stop offset="100%" stop-color="${c2}"/>
            </linearGradient>
            <clipPath id="wc"><rect x="0" y="0" width="${svgW}" height="${h}" rx="20"/></clipPath>
          </defs>
          <g clip-path="url(#wc)">
            <path d="${d0}" fill="url(#tg)">
              <animate attributeName="d" dur="${dur.toFixed(1)}s" repeatCount="indefinite"
                calcMode="linear"
                values="${d0};${d1};${d2};${d0}"/>
            </path>
          </g>
          <text
            x="${amp + (w - amp) * 0.5}"
            y="${h * 0.5}"
            text-anchor="middle"
            dominant-baseline="middle"
            font-family="Inter, Arial, sans-serif"
            font-size="13"
            font-weight="700"
            fill="rgba(255,255,255,0.92)"
          >${escapeHtml(label)}</text>
        </svg>`;
      }

      // ── Obstacle geometry ─────────────────────────────────────────────────
      function getIllustrationRect(illust, bodyWidth, bodyHeight) {
        if (state.activeStoryId === "tide-pools") {
          const tScale = 0.12 + state.tideLevel * 0.78;
          const wScale = illust.width + state.tideLevel * 0.1;
          const w = Math.round(bodyWidth * wScale);
          const h = Math.round(bodyHeight * tScale);
          const x = illust.position === "left" ? 0 : bodyWidth - w;
          return { x, y: 0, w, h };
        }
        if (state.activeStoryId === "garden-robot") {
          const baseW = Math.round(bodyWidth * illust.width);
          const baseH = Math.round(bodyHeight * illust.height);
          const w = Math.round(baseW * state.robotScale);
          const h = Math.round(baseH * state.robotScale);
          if (state.robotPos) {
            return { x: state.robotPos.x, y: state.robotPos.y, w, h };
          }
          const x = illust.position === "left" ? 0 : bodyWidth - w;
          return { x, y: 0, w, h };
        }
        const w = Math.round(bodyWidth * illust.width);
        const h = Math.round(bodyHeight * illust.height);
        const x = illust.position === "left" ? 0 : bodyWidth - w;
        return { x, y: 0, w, h };
      }

      function getPlaneRect(bodyWidth, bodyHeight) {
        if (!state.planeActive) return null;
        const t = state.planeProgress;
        const x = -PLANE_W + t * (bodyWidth + PLANE_W * 2);
        const arcT = Math.sin(t * Math.PI);
        const baseY = bodyHeight * 0.60;
        const peakY = bodyHeight * 0.18;
        const cy = baseY - arcT * (baseY - peakY);
        const angle = Math.cos(Math.PI * t) * -18;
        return {
          x: Math.round(x),
          y: Math.round(cy - PLANE_H / 2),
          w: PLANE_W,
          h: PLANE_H,
          visualCX: Math.round(x + PLANE_W / 2),
          visualCY: Math.round(cy),
          angle,
        };
      }

      // Largest horizontal free interval for a line, given obstacle rects.
      function lineAvailableInterval(lineY, lh, bodyWidth, obstacles) {
        const excl = [];
        for (const obs of obstacles) {
          if (!obs) continue;
          if (lineY + lh <= obs.y || lineY >= obs.y + obs.h) continue;
          excl.push([
            Math.max(0, obs.x - ILLUST_GAP),
            Math.min(bodyWidth, obs.x + obs.w + ILLUST_GAP)
          ]);
        }
        if (excl.length === 0) return { x: 0, w: bodyWidth };

        const pts = [0, bodyWidth];
        for (const [a, b] of excl) {
          if (a > 0) pts.push(a);
          if (b < bodyWidth) pts.push(b);
        }
        pts.sort((a, b) => a - b);

        let bestX = 0, bestW = 0;
        for (let i = 0; i + 1 < pts.length; i++) {
          const start = pts[i], end = pts[i + 1];
          if (end <= start + 1) continue;
          const blocked = excl.some(([a, b]) => a < end && b > start);
          if (!blocked && end - start > bestW) { bestX = start; bestW = end - start; }
        }
        return bestW >= 40 ? { x: bestX, w: bestW } : { x: 0, w: bodyWidth };
      }

      // ── Pretext ───────────────────────────────────────────────────────────
      async function importPretext() {
        const urls = [
          "https://esm.sh/@chenglou/pretext@0.0.4?bundle",
          "https://cdn.jsdelivr.net/npm/@chenglou/pretext@0.0.4/+esm",
        ];
        let lastErr;
        for (const url of urls) {
          try { return await import(url); } catch (e) { lastErr = e; }
        }
        throw lastErr;
      }

      async function ensureFonts(size) {
        if (!("fonts" in document)) return;
        await Promise.all([
          document.fonts.load(fontString(size)),
          document.fonts.load(`700 24px "Fraunces", Georgia, serif`),
          document.fonts.ready,
        ]);
      }

      function prepareAllTexts() {
        state.preparedTexts.clear();
        const font = fontString(state.fontSize);
        for (const story of STORIES) {
          for (let i = 0; i < story.pages.length; i++) {
            const key = `${story.id}-${i}`;
            state.preparedTexts.set(key, {
              simple: state.pretext.prepare(story.pages[i].text, font),
              segments: state.pretext.prepareWithSegments(story.pages[i].text, font),
            });
          }
        }
      }

      // ── Layout ────────────────────────────────────────────────────────────
      function paginateStory() {
        const story = activeStory();
        const lh = lineHeight(state.fontSize);
        const style = getComputedStyle(pageCanvas);
        const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
        const bodyWidth = Math.max(200, pageCanvas.clientWidth - padX);
        const bodyHeight = Math.max(300, Math.min(640, window.innerHeight - 280));
        const planeRect = getPlaneRect(bodyWidth, bodyHeight);
        const pages = [];

        for (let pi = 0; pi < story.pages.length; pi++) {
          const pageData = story.pages[pi];
          const key = `${story.id}-${pi}`;
          const prepared = state.preparedTexts.get(key);
          if (!prepared) continue;

          const illustRect = pageData.illustration
            ? getIllustrationRect(pageData.illustration, bodyWidth, bodyHeight)
            : null;

          const obstacles = [illustRect, planeRect].filter(Boolean);
          let cursor = { segmentIndex: 0, graphemeIndex: 0 };
          let y = 0;
          const lines = [];
          const maxY = bodyHeight;

          while (y + lh <= maxY) {
            const { x: lineX, w: availW } = lineAvailableInterval(y, lh, bodyWidth, obstacles);
            if (availW < 40) { y += lh; continue; }
            const line = state.pretext.layoutNextLine(prepared.segments, cursor, availW);
            if (line === null) break;
            lines.push({ text: line.text, width: line.width, x: lineX, y, availWidth: availW });
            cursor = line.end;
            y += lh;
          }

          const hasMore = state.pretext.layoutNextLine(prepared.segments, cursor, bodyWidth) !== null;

          pages.push({
            storyPageIndex: pi,
            lines,
            illustRect,
            planeRect,
            illustration: pageData.illustration,
            bodyWidth,
            bodyHeight,
            isFirstStoryPage: pi === 0,
          });

          if (hasMore) {
            let remainCursor = cursor;
            while (true) {
              let oy = 0;
              const oLines = [];
              while (oy + lh <= maxY) {
                const { x: oX, w: oW } = lineAvailableInterval(oy, lh, bodyWidth, [planeRect].filter(Boolean));
                const oLine = state.pretext.layoutNextLine(prepared.segments, remainCursor, oW);
                if (oLine === null) { remainCursor = null; break; }
                oLines.push({ text: oLine.text, width: oLine.width, x: oX, y: oy, availWidth: oW });
                remainCursor = oLine.end;
                oy += lh;
              }
              if (oLines.length === 0) break;
              const stillMore = remainCursor &&
                state.pretext.layoutNextLine(prepared.segments, remainCursor, bodyWidth) !== null;
              pages.push({
                storyPageIndex: pi, lines: oLines, illustRect: null, planeRect,
                illustration: null, bodyWidth, bodyHeight, isFirstStoryPage: false,
              });
              if (!stillMore || !remainCursor) break;
            }
          }
        }

        state.paginatedPages = pages;
        state.totalPages = pages.length;
        if (state.currentPage >= state.totalPages) {
          state.currentPage = Math.max(0, state.totalPages - 1);
        }
      }

      // ── Render ────────────────────────────────────────────────────────────
      function renderPage() {
        const story = activeStory();
        const page = state.paginatedPages[state.currentPage];
        if (!page) {
          pageCanvas.innerHTML = '<div class="status-banner">No pages to display.</div>';
          return;
        }

        const lh = lineHeight(state.fontSize);
        const isTide  = story.id === "tide-pools";
        const isRobot = story.id === "garden-robot";
        let html = "";

        if (page.isFirstStoryPage) {
          html += `<div class="page-title-block">
            <h2>${escapeHtml(story.title)}</h2>
            <div class="byline">${escapeHtml(story.author)}</div>
          </div>`;
        }

        html += `<div class="page-body" style="height:${page.bodyHeight}px">`;

        // Tide wave (SVG illustration)
        if (isTide && page.illustration && page.illustRect) {
          html += renderTideWaveSvg(page.illustRect, state.tideLevel);
        }

        // Robot / plane-page rectangular illustration
        if (!isTide && page.illustration && page.illustRect) {
          const r = page.illustRect;
          html += `<div
            class="illustration-zone${isRobot ? " illustration-zone--draggable" : ""}"
            style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${page.illustration.color};"
          >
            <span class="illustration-zone__label">${escapeHtml(page.illustration.label)}</span>
            ${isRobot ? '<span class="drag-indicator">&#x2195; drag me</span>' : ""}
          </div>`;
        }

        // Garden emojis orbiting the robot
        if (isRobot && page.illustRect) {
          const r = page.illustRect;
          // Place emojis on the non-text side (right side for left-positioned, left for right-positioned)
          // since robot can be dragged anywhere, anchor to fixed offsets from rect edges
          const emojiDefs = [
            { e: "🌱", x: r.x + r.w + 8,      y: r.y + 10 },
            { e: "🌿", x: r.x + r.w + 8,      y: r.y + r.h - 34 },
            { e: "🍅", x: r.x + r.w + 8,      y: r.y + r.h / 2 - 12 },
            { e: "🌻", x: r.x + r.w / 2 - 10, y: r.y - 32 },
            { e: "🐝", x: r.x + r.w / 2 + 14, y: r.y - 30 },
            { e: "🌱", x: r.x - 30,            y: r.y + r.h / 2 - 10 },
          ];
          for (const { e, x, y } of emojiDefs) {
            html += `<span class="garden-emoji" style="left:${x}px;top:${y}px">${e}</span>`;
          }
        }

        // Plane sprite
        if (page.planeRect && state.planeActive) {
          const pr = page.planeRect;
          html += `<div
            class="plane-sprite"
            style="left:${pr.visualCX - 17}px;top:${pr.visualCY - 17}px;transform:rotate(${pr.angle}deg);"
            aria-hidden="true"
          >&#x2708;</div>`;
        }

        // Text lines
        for (let i = 0; i < page.lines.length; i++) {
          const line = page.lines[i];
          const highlighted = state.readAlong && i === state.highlightedLine;
          html += `<span
            class="text-line"
            data-line-index="${i}"
            data-highlighted="${highlighted}"
            style="left:${line.x}px;top:${line.y}px;font-size:${state.fontSize}px;line-height:${lh}px;height:${lh}px;"
          >${escapeHtml(line.text)}</span>`;
        }

        html += `</div>`;
        pageCanvas.innerHTML = html;

        prevBtn.disabled = state.currentPage === 0;
        nextBtn.disabled = state.currentPage >= state.totalPages - 1;
        pageIndicator.textContent = `${state.currentPage + 1} / ${state.totalPages}`;
        pageDots.innerHTML = Array.from({ length: state.totalPages }, (_, i) =>
          `<span class="page-dot" data-active="${i === state.currentPage}"></span>`
        ).join("");
      }

      // ── UI helpers ────────────────────────────────────────────────────────
      function buildStoryPicker() {
        storyPicker.innerHTML = STORIES.map(s =>
          `<button type="button" data-story="${s.id}" data-active="${s.id === state.activeStoryId}">${escapeHtml(s.title)}</button>`
        ).join("");
      }

      function updateLayoutMeta(ms) {
        const page = state.paginatedPages[state.currentPage];
        const lineCount = page ? page.lines.length : 0;
        let text = `${state.totalPages} pages, ${lineCount} lines on this page`;
        if (ms != null) text += `, layout: ${ms.toFixed(2)}ms`;
        if (state.planeActive && state.fps > 0) text += ` \u2014 ~${state.fps}fps`;
        layoutMeta.textContent = text;
      }

      function speedLabel(s) {
        return s === 1 ? "1\xd7" : s < 1 ? `${s}\xd7` : `${s}\xd7`;
      }

      function updateStoryControls() {
        const id = state.activeStoryId;
        let html = "";

        if (id === "tide-pools") {
          const pct = Math.round(state.tideLevel * 100);
          const lbl = pct < 18 ? "Low" : pct < 45 ? "Rising" : pct < 78 ? "High" : "MAX";
          html = `
            <span class="story-hint">Drag the tide &mdash; text reflows without re-measuring a single character</span>
            <div class="control-group">
              <span class="control-label">&#x1F30A; Tide</span>
              <input type="range" id="tideSlider" min="0" max="100" value="${pct}" style="width:130px;accent-color:var(--accent)" />
              <span class="control-value" id="tideValueDisplay">${lbl}</span>
            </div>`;

        } else if (id === "garden-robot") {
          const pct = Math.round(state.robotScale * 100);
          html = `
            <span class="story-hint">Drag Milo anywhere &mdash; text reroutes to the wider side without re-measuring</span>
            <div class="control-group">
              <span class="control-label">&#x1F4CF; Size</span>
              <input type="range" id="robotSizeSlider" min="40" max="140" value="${pct}" style="width:100px;accent-color:var(--accent)" />
              <span class="control-value" id="robotSizeDisplay">${pct}%</span>
            </div>
            <button id="resetRobotBtn" class="story-btn">Reset</button>`;

        } else if (id === "paper-planes") {
          const active = state.planeActive;
          const sp = state.planeSpeed;
          html = `
            <span class="story-hint">Text dodges the plane every frame &mdash; layout at 60fps, zero DOM reads</span>
            <div class="control-group">
              <span class="control-label">Speed</span>
              <input type="range" id="planeSpeedSlider" min="25" max="400" value="${Math.round(sp * 100)}" step="25" style="width:100px;accent-color:var(--accent)" />
              <span class="control-value" id="planeSpeedDisplay">${speedLabel(sp)}</span>
            </div>
            <button id="launchBtn" class="story-btn${active ? " story-btn--active" : ""}">${active ? "&#x2715; Cancel" : "&#x2708; Launch"}</button>`;
        }

        storyControlsEl.hidden = !html;
        storyControlsEl.innerHTML = html;

        // Bind fresh listeners
        const tideSlider = document.getElementById("tideSlider");
        if (tideSlider) {
          tideSlider.addEventListener("input", e => {
            state.tideLevel = parseInt(e.target.value, 10) / 100;
            const pct = Math.round(state.tideLevel * 100);
            const disp = document.getElementById("tideValueDisplay");
            if (disp) disp.textContent = pct < 18 ? "Low" : pct < 45 ? "Rising" : pct < 78 ? "High" : "MAX";
            const t0 = performance.now();
            paginateStory();
            renderPage();
            updateLayoutMeta(performance.now() - t0);
          });
        }

        const robotSizeSlider = document.getElementById("robotSizeSlider");
        if (robotSizeSlider) {
          robotSizeSlider.addEventListener("input", e => {
            state.robotScale = parseInt(e.target.value, 10) / 100;
            const disp = document.getElementById("robotSizeDisplay");
            if (disp) disp.textContent = `${Math.round(state.robotScale * 100)}%`;
            const t0 = performance.now();
            paginateStory();
            renderPage();
            updateLayoutMeta(performance.now() - t0);
          });
        }

        const resetRobotBtn = document.getElementById("resetRobotBtn");
        if (resetRobotBtn) {
          resetRobotBtn.addEventListener("click", () => {
            state.robotPos = null;
            state.robotScale = 1.0;
            const slider = document.getElementById("robotSizeSlider");
            const disp = document.getElementById("robotSizeDisplay");
            if (slider) slider.value = 100;
            if (disp) disp.textContent = "100%";
            fullRender(false);
          });
        }

        const planeSpeedSlider = document.getElementById("planeSpeedSlider");
        if (planeSpeedSlider) {
          planeSpeedSlider.addEventListener("input", e => {
            const newSpeed = parseInt(e.target.value, 10) / 100;
            const disp = document.getElementById("planeSpeedDisplay");
            if (disp) disp.textContent = speedLabel(newSpeed);

            if (state.planeActive) {
              // Preserve current progress when changing speed mid-flight
              const elapsed = performance.now() - state.planeStartTime;
              const currentProgress = elapsed / state.planeEffectiveDuration;
              state.planeEffectiveDuration = PLANE_BASE_DURATION / newSpeed;
              state.planeStartTime = performance.now() - currentProgress * state.planeEffectiveDuration;
            } else {
              state.planeEffectiveDuration = PLANE_BASE_DURATION / newSpeed;
            }
            state.planeSpeed = newSpeed;
          });
        }

        const launchBtn = document.getElementById("launchBtn");
        if (launchBtn) launchBtn.addEventListener("click", launchPlane);
      }

      // ── Render cycle ──────────────────────────────────────────────────────
      function fullRender(scroll) {
        const t0 = performance.now();
        paginateStory();
        const ms = performance.now() - t0;
        renderPage();
        updateLayoutMeta(ms);
        if (scroll) pageCanvas.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function scheduleRender() {
        if (state.rafId !== null) return;
        state.rafId = requestAnimationFrame(() => { state.rafId = null; fullRender(false); });
      }

      function goToPage(n) {
        state.currentPage = Math.max(0, Math.min(state.totalPages - 1, n));
        state.highlightedLine = state.readAlong ? 0 : -1;
        renderPage();
        updateLayoutMeta(null);
      }

      function advanceReadAlong() {
        if (!state.readAlong) return;
        const page = state.paginatedPages[state.currentPage];
        if (!page) return;
        if (state.highlightedLine < page.lines.length - 1) {
          state.highlightedLine++;
          pageCanvas.querySelectorAll(".text-line").forEach((el, i) => {
            el.dataset.highlighted = String(i === state.highlightedLine);
          });
        } else if (state.currentPage < state.totalPages - 1) {
          goToPage(state.currentPage + 1);
        }
      }

      // ── Plane animation ───────────────────────────────────────────────────
      function launchPlane() {
        if (state.planeAnimRaf) {
          cancelAnimationFrame(state.planeAnimRaf);
          state.planeAnimRaf = null;
          state.planeActive = false;
          state.fps = 0;
          fullRender(false);
          updateStoryControls();
          return;
        }

        state.planeActive = true;
        state.planeProgress = 0;
        state.planeEffectiveDuration = PLANE_BASE_DURATION / state.planeSpeed;
        state.planeStartTime = performance.now();
        state.lastFrameTime = performance.now();

        const btn = document.getElementById("launchBtn");
        if (btn) { btn.textContent = "\u2715 Cancel"; btn.classList.add("story-btn--active"); }

        function tick() {
          const now = performance.now();
          const dt = now - state.lastFrameTime;
          state.fps = dt > 0 ? Math.round(1000 / dt) : 0;
          state.lastFrameTime = now;
          state.planeProgress = Math.min(1, (now - state.planeStartTime) / state.planeEffectiveDuration);

          const t0 = performance.now();
          paginateStory();
          renderPage();
          updateLayoutMeta(performance.now() - t0);

          if (state.planeProgress < 1) {
            state.planeAnimRaf = requestAnimationFrame(tick);
          } else {
            state.planeActive = false;
            state.planeAnimRaf = null;
            state.fps = 0;
            fullRender(false);
            updateStoryControls();
          }
        }

        state.planeAnimRaf = requestAnimationFrame(tick);
      }

      // ── Events ────────────────────────────────────────────────────────────
      function attachEvents() {
        storyPicker.addEventListener("click", e => {
          const btn = e.target.closest("[data-story]");
          if (!btn) return;
          if (state.planeAnimRaf) {
            cancelAnimationFrame(state.planeAnimRaf);
            state.planeAnimRaf = null;
            state.planeActive = false;
            state.fps = 0;
          }
          state.robotPos = null;
          state.robotScale = 1.0;
          state.tideLevel = 0.25;
          state.activeStoryId = btn.dataset.story;
          state.currentPage = 0;
          state.highlightedLine = state.readAlong ? 0 : -1;
          document.documentElement.style.setProperty("--accent", activeStory().accent);
          buildStoryPicker();
          prepareAllTexts();
          fullRender(false);
          updateStoryControls();
        });

        fontSlider.addEventListener("input", e => {
          state.fontSize = parseInt(e.target.value, 10);
          fontValue.textContent = `${state.fontSize}px`;
          ensureFonts(state.fontSize).then(() => {
            prepareAllTexts();
            state.highlightedLine = state.readAlong ? 0 : -1;
            fullRender(false);
          });
        });

        readAlongToggle.addEventListener("change", e => {
          state.readAlong = e.target.checked;
          state.highlightedLine = state.readAlong ? 0 : -1;
          renderPage();
        });

        prevBtn.addEventListener("click", () => goToPage(state.currentPage - 1));
        nextBtn.addEventListener("click", () => goToPage(state.currentPage + 1));
        pageCanvas.addEventListener("click", () => { if (state.readAlong) advanceReadAlong(); });

        // Robot drag — event delegation, survives re-renders
        pageCanvas.addEventListener("pointerdown", e => {
          if (state.activeStoryId !== "garden-robot") return;
          const zone = e.target.closest(".illustration-zone--draggable");
          if (!zone) return;
          e.preventDefault();

          const bodyEl = pageCanvas.querySelector(".page-body");
          if (!bodyEl) return;
          const bodyRect = bodyEl.getBoundingClientRect();
          const page = state.paginatedPages[state.currentPage];
          if (!page || !page.illustRect) return;

          const anchor = {
            px: e.clientX, py: e.clientY,
            ox: page.illustRect.x, oy: page.illustRect.y,
            ow: page.illustRect.w, oh: page.illustRect.h,
            bw: bodyRect.width, bh: bodyRect.height,
          };

          function onMove(ev) {
            const nx = Math.max(0, Math.min(anchor.bw - anchor.ow, anchor.ox + ev.clientX - anchor.px));
            const ny = Math.max(0, Math.min(anchor.bh - anchor.oh, anchor.oy + ev.clientY - anchor.py));
            state.robotPos = { x: nx, y: ny };
            const t0 = performance.now();
            paginateStory();
            renderPage();
            updateLayoutMeta(performance.now() - t0);
          }

          function onUp() {
            document.removeEventListener("pointermove", onMove);
            document.removeEventListener("pointerup", onUp);
          }

          document.addEventListener("pointermove", onMove);
          document.addEventListener("pointerup", onUp);
        });

        document.addEventListener("keydown", e => {
          if (e.key === "ArrowLeft") goToPage(state.currentPage - 1);
          else if (e.key === "ArrowRight") {
            if (state.readAlong) advanceReadAlong();
            else goToPage(state.currentPage + 1);
          } else if (e.key === " " && state.readAlong) {
            e.preventDefault();
            advanceReadAlong();
          }
        });

        window.addEventListener("resize", scheduleRender);
      }

      // ── Boot ──────────────────────────────────────────────────────────────
      async function boot() {
        buildStoryPicker();
        document.documentElement.style.setProperty("--accent", activeStory().accent);
        statusBanner.hidden = false;
        try {
          const pretext = await importPretext();
          state.pretext = pretext;
          await ensureFonts(state.fontSize);
          prepareAllTexts();
          attachEvents();
          statusBanner.hidden = true;
          fullRender(false);
          updateStoryControls();
        } catch (err) {
          statusBanner.hidden = false;
          statusBanner.textContent = "Could not load Pretext. Check your connection or swap the CDN URL.";
          console.error(err);
        }
      }

      boot();
    </script>
  </body>
</html>
